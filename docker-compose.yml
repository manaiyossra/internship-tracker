services:
  backend:
    build:
      context: ./backend
    container_name: internship-tracker-backend
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://192.168.133.150:3000
    container_name: internship-tracker-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
